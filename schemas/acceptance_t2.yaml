# t2_clean 验收标准 (清洗后来源字段不得丢失)
acceptance:
  - type: file_exists
    path: artifacts/clean.json
  - type: command
    cmd: python3 -c "import json; d=json.load(open('artifacts/clean.json')); assert len(d)>0"
    expect_exit: 0
  - type: business_rule
    expr: "null_rate < 0.01"
  - type: traceability
    path: artifacts/clean.json
    record_fields: [url, publisher, publish_date, source_id]
    source_url_min: 1
  - type: human_approval
    required: false
